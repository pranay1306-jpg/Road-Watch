<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Issue - RoadWatch</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s-8-4.5-8-11.8A8 8 0 0 1 12 2a8 8 0 0 1 8 8.2c0 7.3-8 11.8-8 11.8z"/><circle cx="12" cy="10" r="3"/></svg>
            RoadWatch
        </a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="report.html" style="color: var(--primary)">Report Issue</a></li>
            <li><a href="issues.html">View Issues</a></li>
            <li><a href="analytics.html">Analytics</a></li>
        </ul>
    </nav>

    <main class="container" style="max-width: 700px;">
        <h2 style="margin-bottom: 1.5rem;">Report a Road Issue</h2>
        
        <div class="card">
            <div style="background-color: var(--warning); color: #fff; padding: 1rem; border-radius: var(--radius); margin-bottom: 1.5rem;">
                <strong>Note:</strong> You are viewing the static version of the site. Submitting forms will not save data since the Python server is offline.
            </div>
            <form id="issueForm">
                <div class="form-group">
                    <label for="title">Issue Title <span style="color: var(--danger)">*</span></label>
                    <input type="text" id="title" name="title" class="form-control" required placeholder="e.g., Deep Pothole on Main St">
                </div>
                
                <div class="form-group">
                    <label for="issue_type">Issue Type <span style="color: var(--danger)">*</span></label>
                    <select id="issue_type" name="issue_type" class="form-control" required>
                        <option value="">Select a category</option>
                        <option value="pothole">Pothole</option>
                        <option value="waterlogging">Waterlogging</option>
                        <option value="poor lighting">Poor Lighting</option>
                        <option value="encroachment">Encroachment</option>
                        <option value="broken signal">Broken Signal</option>
                        <option value="other">Other</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="area">Ward / Locality <span style="color: var(--danger)">*</span></label>
                    <input type="text" id="area" name="area" class="form-control" required placeholder="e.g., North Ward, Sector 4">
                </div>
                
                <div class="form-group">
                    <label for="address">Full Address / Landmark <span style="color: var(--danger)">*</span></label>
                    <textarea id="address" name="address" class="form-control" rows="2" required placeholder="Near the central park entrance"></textarea>
                </div>
                
                <div class="form-group">
                    <label for="description">Detailed Description <span style="color: var(--danger)">*</span></label>
                    <textarea id="description" name="description" class="form-control" rows="4" required placeholder="Describe the issue..."></textarea>
                </div>
                
                <div class="grid grid-cols-2" style="grid-template-columns: 1fr 1fr; gap: 1rem;">
                    <div class="form-group">
                        <label for="severity">Severity</label>
                        <select id="severity" name="severity" class="form-control">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="date_observed">Date Observed</label>
                        <input type="date" id="date_observed" name="date_observed" class="form-control">
                    </div>
                </div>
                
                <div style="margin-top: 1rem;">
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Submit Report</button>
                </div>
            </form>
        </div>
    </main>

    <div id="toast">Message goes here</div>

    <footer>
        <p>&copy; 2026 RoadWatch. A National Road Safety Hackathon Project.</p>
    </footer>

    <script src="js/app.js"></script>
</body>
</html>
